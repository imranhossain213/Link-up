<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- tailwind cnd link -->
   <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>Login page</title>
</head>
 <body class="bg-emerald-50 min-h-screen flex items-center justify-center">
   <section class="">
    <div class="bg-white p-8 rounded-2xl shadow-2xl ">
        <h1 class="text-2xl text-emerald-900 font-bold mb-2 text-center">Login page</h1>

     <form action="#" class="flex flex-col">
        <label class="text-emerald-900 font-semibold mb-1  " for="email">Email</label>
        <input class="border w-full rounded-lg p-1 mb-2 " id="email" type="email" placeholder="Enter your email">
        <label class="text-emerald-900 font-semibold mb-1" for="password">Password</label>
        <input class="border w-full rounded-lg p-1 mb-4 " id="password" type="password" placeholder="Enter your password">
        <input class="text-emerald-900 font-semibold bg-emerald-500 px-3 py-[2px] block rounded-lg w-full pb-1 cursor-pointer hover:bg-emerald-300 mb-4" type="submit" value="Log in">
     </form>   
     <p class="text-gray-400 text-sm ">Don't have an account? <a class="text-emerald-400 underline" href="#">Sign Up</a></p>
    </div>
   </section>


 </body>
</html>
